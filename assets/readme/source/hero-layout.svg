<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="480" viewBox="0 0 1200 480">
  <title>fast-io：让 Antigravity 少走回合、少等审查</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect width="1200" height="480" rx="24" fill="#F6F1E7"/>

  <g id="title-block" class="sans">
    <image id="antigravity-logo" href="antigravity-logo.png" x="64" y="70" width="46" height="40" preserveAspectRatio="xMidYMid meet"/>
    <text x="124" y="101" font-size="24" font-weight="600" fill="#3A3833">Antigravity 插件</text>
    <text x="58" y="214" font-size="108" font-weight="800" letter-spacing="-3" fill="#161514">fast-io</text>
    <text x="64" y="276" font-size="33" font-weight="700" fill="#1E1D1B">让 Antigravity 少走回合、少等审查</text>
    <rect id="highlight" x="60" y="320" width="334" height="18" rx="4" fill="#F5CF5A" opacity="0.55"/>
    <text x="64" y="334" font-size="25" font-weight="600" fill="#3A3833">实测用时和回合都少了约一半</text>
    <text x="64" y="414" class="mono" font-size="18" fill="#8C867A">非官方插件 · 只有一份规则 · MIT</text>
  </g>

  <image id="subject" href="hero-subject.png" x="652" y="46" width="496" height="388" preserveAspectRatio="xMidYMid meet"/>
</svg>
