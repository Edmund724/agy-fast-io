<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">fast-io：让 Antigravity 少走回合、少等审查</title>
  <desc id="desc">fast-io 处理的 Antigravity 问题：回合太多，改成先 grep 定位、一轮并行读完；检索命令触发云端审查，改成只用免审命令；脚本一步一跑，改成几步合成一次跑；最后的回答太长，改成先给结论。实测用时和回合都少了约一半。</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect width="1200" height="540" rx="24" fill="#0D1017"/>

  <g id="title-block" class="sans">
    <text x="64" y="76" class="mono" font-size="18" letter-spacing="2" fill="#8B93A1">ANTIGRAVITY PLUGIN · 只有一份规则</text>
    <text x="60" y="152" font-size="80" font-weight="800" letter-spacing="-2" fill="#EEF1F5">fast-io</text>
    <text x="64" y="204" font-size="30" font-weight="600" fill="#EEF1F5">让 Antigravity 少走回合、少等审查</text>
  </g>

  <g id="result" class="sans" text-anchor="end">
    <text x="1136" y="166" font-size="19" fill="#8B93A1">在 2,000+ 文件的项目上实测</text>
    <text x="1136" y="204" font-size="28" font-weight="700" fill="#4FD1A5">用时和回合都少了约一半</text>
  </g>

  <g id="board" class="sans">
    <text x="64" y="268" font-size="19" font-weight="600" fill="#8B93A1">Antigravity 的问题</text>
    <text x="700" y="268" font-size="19" font-weight="600" fill="#4FD1A5">fast-io 的处理</text>
    <line x1="64" y1="284" x2="1136" y2="284" stroke="#2A3140" stroke-width="2"/>

    <g id="row-turns">
      <text x="64" y="322" font-size="23" font-weight="700" fill="#F2A541">回合太多</text>
      <text x="240" y="322" font-size="21" fill="#A3AAB6">读一个文件、想一下、再读下一个</text>
      <text x="646" y="322" font-size="22" fill="#6B7380">→</text>
      <text x="700" y="322" font-size="22" font-weight="600" fill="#EEF1F5">先 grep 拿到行号，一轮并行读完</text>
      <line x1="64" y1="340" x2="1136" y2="340" stroke="#1C212B" stroke-width="2"/>
    </g>

    <g id="row-review">
      <text x="64" y="378" font-size="23" font-weight="700" fill="#F2A541">云端审查</text>
      <text x="240" y="378" font-size="21" fill="#A3AAB6"><tspan class="mono">rg</tspan>、<tspan class="mono">find</tspan>、<tspan class="mono">&amp;&amp;</tspan> 每次多等 2–3 秒</text>
      <text x="646" y="378" font-size="22" fill="#6B7380">→</text>
      <text x="700" y="378" font-size="22" font-weight="600" fill="#EEF1F5">检索只用免审的 <tspan class="mono">grep</tspan>、<tspan class="mono">ls</tspan>、<tspan class="mono">git</tspan></text>
      <line x1="64" y1="396" x2="1136" y2="396" stroke="#1C212B" stroke-width="2"/>
    </g>

    <g id="row-scripts">
      <text x="64" y="434" font-size="23" font-weight="700" fill="#F2A541">脚本一步一跑</text>
      <text x="240" y="434" font-size="21" fill="#A3AAB6">每一步都要审一次、等一轮</text>
      <text x="646" y="434" font-size="22" fill="#6B7380">→</text>
      <text x="700" y="434" font-size="22" font-weight="600" fill="#EEF1F5">互不依赖的几步，合成一次跑</text>
      <line x1="64" y1="452" x2="1136" y2="452" stroke="#1C212B" stroke-width="2"/>
    </g>

    <g id="row-answer">
      <text x="64" y="490" font-size="23" font-weight="700" fill="#F2A541">回答太长</text>
      <text x="240" y="490" font-size="21" fill="#A3AAB6">最后一轮写上万字，占大半时间</text>
      <text x="646" y="490" font-size="22" fill="#6B7380">→</text>
      <text x="700" y="490" font-size="22" font-weight="600" fill="#EEF1F5">先给结论，不复述代码</text>
    </g>
  </g>
</svg>
